name: Build Rusdi.ipk

# Arquivo unico e autocontido: contem o codigo do Rusdi (base64) e compila para
# LG webOS usando o toolchain nativo do webosbrew + SDL2 do fork SDL-webOS.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Instalar Rust (alvo ARM webOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi

