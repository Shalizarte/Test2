      - name: Baixar toolchain webOS
        run: |
          set -eux
          mkdir -p "$HOME/sdk"
          cd "$HOME/sdk"
          curl -fL --retry 3 -o tc.tgz https://github.com/openlgtv/buildroot-nc4/releases/latest/download/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          tar xzf tc.tgz
          SDK="$(find "$PWD" -maxdepth 1 -type d -name 'arm-webos-linux-gnueabi_sdk-buildroot*' | head -1)"
          test -n "$SDK" || { ls -la; exit 1; }
          "$SDK/relocate-sdk.sh"
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Baixar SDL2 para webOS
        run: |
          set -eux
          mkdir -p "$HOME/sdl" "$HOME/link" "$HOME/libs"
          cd "$HOME/sdl"
          (curl -fL --retry 3 -o sdl.tgz https://github.com/webosbrew/SDL-webOS/releases/download/release-2.30.0-2/SDL2-2.30.0-webos.tar.gz && tar xzf sdl.tgz) || echo "SDL prebuilt indisponivel, usando o do toolchain"
          LIB="$(find "$HOME/sdl" -name 'libSDL2-2.0.so*' | head -1)"
          if [ -z "$LIB" ]; then LIB="$(find "$SDK" -name 'libSDL2-2.0.so*' | head -1)"; fi
          test -n "$LIB"
          cp "$(readlink -f "$LIB")" "$HOME/libs/libSDL2-2.0.so.0"
          cp "$HOME/libs/libSDL2-2.0.so.0" "$HOME/link/libSDL2-2.0.so.0"
          ln -sf libSDL2-2.0.so.0 "$HOME/link/libSDL2.so"
          echo "SDL usado: $LIB"

      - name: Compilar o binario rusdi
        working-directory: rusdi
        run: |
          set -eux
          SYSROOT="$("$SDK/bin/arm-webos-linux-gnueabi-gcc" -print-sysroot)"
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER="$SDK/bin/arm-webos-linux-gnueabi-gcc"
          export RUSTFLAGS="-L native=$HOME/link -C link-arg=-Wl,-rpath,\$ORIGIN/lib -C link-arg=-Wl,-rpath-link,$SYSROOT/usr/lib -C link-arg=-Wl,--allow-shlib-undefined -C link-arg=-lc"
          cargo build --release --target armv7-unknown-linux-gnueabi
          BIN=target/armv7-unknown-linux-gnueabi/release/rusdi
          file "$BIN" || true
          "$SDK/bin/arm-webos-linux-gnueabi-readelf" -d "$BIN" | grep -E "NEEDED|RPATH|RUNPATH" || true
          ls -la "$BIN"

      - name: Gerar icones e empacotar Rusdi.ipk
        working-directory: rusdi
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core python3-pil
          python3 tools/make_icons.py
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf webos/assets/rusdi.ttf
          python3 tools/package.py --no-source --binary target/armv7-unknown-linux-gnueabi/release/rusdi --libs "$HOME/libs" --out dist/Rusdi.ipk

      - uses: actions/upload-artifact@v4
        with:
          name: Rusdi-ipk
          path: rusdi/dist/Rusdi.ipk

      - name: Publicar em Releases (download direto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" rusdi/dist/Rusdi.ipk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Rusdi build ${{ github.run_number }}" --notes "Rusdi.ipk compilado para LG webOS"
